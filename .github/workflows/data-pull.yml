name: data-pull
on:
  push:
    branches: [data-pull]
    paths: [".github/workflows/data-pull.yml"]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: Fetch ETHU and ETH-USD daily (Yahoo)
        run: |
          python - <<'PY'
          import yfinance as yf, pandas as pd, time
          for t in ["ETHU", "ETH-USD"]:
              for i in range(4):
                  try:
                      df = yf.Ticker(t).history(start="2010-01-01", interval="1d", auto_adjust=False, actions=True)
                      if len(df): break
                  except Exception as e:
                      print(t, "attempt", i, e)
                  time.sleep(5 * (i + 1))
              df.index = pd.to_datetime(df.index).tz_localize(None).date
              df.index.name = "date"
              df.to_csv(f"pull/{t}.csv")
              print(t, len(df), df.index.min(), df.index.max())
          PY
      - name: Fetch ETH-USD hourly from Coinbase (for 4pm New York price)
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, pandas as pd, time
          from datetime import datetime, timedelta, timezone
          url = "https://api.exchange.coinbase.com/products/ETH-USD/candles"
          start = datetime(2024, 5, 1, tzinfo=timezone.utc); end = datetime.now(timezone.utc)
          rows, t = [], start
          while t < end:
              t2 = min(t + timedelta(hours=300), end)
              for i in range(5):
                  r = requests.get(url, params={"granularity": 3600, "start": t.isoformat(), "end": t2.isoformat()},
                                   headers={"User-Agent": "macro-markets-data"}, timeout=30)
                  if r.status_code == 200: break
                  time.sleep(2 * (i + 1))
              r.raise_for_status()
              rows += r.json(); t = t2; time.sleep(0.4)
          df = pd.DataFrame(rows, columns=["time", "low", "high", "open", "close", "volume"]).drop_duplicates("time").sort_values("time")
          df["time_utc"] = pd.to_datetime(df["time"], unit="s", utc=True)
          df.drop(columns="time").to_csv("pull/ETH-USD_coinbase_hourly.csv", index=False)
          print("coinbase hourly", len(df), df.time_utc.min(), df.time_utc.max())
          PY
      - name: Save results to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A pull
          git commit -m "data pull results"
          git push
