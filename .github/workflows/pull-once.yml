name: pull-once
on:
  push:
    branches: [data-pull-tqqq-ndx]
    paths: ["scripts/pull_once.py", ".github/workflows/pull-once.yml"]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/pull_once.py
      - name: Save results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data_pull
          git commit -m "Data pull results" && git push
