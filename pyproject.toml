[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdata"
version = "0.1.0"
description = "Comparable market and macro data getter (data only, no analysis)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "requests>=2.31", "python-dotenv>=1.0", "yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmdata = ["series.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
